  emscripten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install emsdk
        run: |
          git clone https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install latest
          /opt/emsdk/emsdk activate latest
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            build/vcpkg_installed
            injamm-build/vcpkg_installed
          key: ${{ runner.os }}-emscripten-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-emscripten-vcpkg-
      - name: Install vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi
      - name: Install injamm
        run: |
          source /opt/emsdk/emsdk_env.sh
          git clone $INJAMM_REPO injamm
          cd injamm
          git fetch --depth 1 origin $INJAMM_REF
          git checkout FETCH_HEAD
          cd ..
          cmake -B injamm-build -S injamm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DCMAKE_INSTALL_PREFIX=$HOME/injamm-install \
            -DBUILD_TEST=OFF -DBUILD_EXAMPLE=OFF -DBUILD_FUZZ=OFF
          cmake --build injamm-build
          cmake --install injamm-build
      - name: Configure
        run: |
          source /opt/emsdk/emsdk_env.sh
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DCMAKE_PREFIX_PATH=$HOME/injamm-install \
            -Dinjamm_DIR=$HOME/injamm-install/lib/cmake/injamm \
            -DBUILD_EXAMPLE=OFF \
            -DBUILD_FUZZ=OFF
      - name: Build
        run: |
          source /opt/emsdk/emsdk_env.sh
          cmake --build build
      - name: Test
        run: |
          source /opt/emsdk/emsdk_env.sh
          ctest --test-dir build -V

  linux-wasip1:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build git curl zip unzip tar

      - name: Install wasi-sdk
        run: |
          WASI_VERSION=34
          curl -sL --max-time 300 -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/wasi-sdk-${WASI_VERSION}.0-x86_64-linux.tar.gz
          mkdir -p /opt/wasi-sdk
          tar xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          /opt/wasi-sdk/bin/clang++ --version

      - name: Install wasmedge
        run: |
          curl -sSf --max-time 300 https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install_v2.sh | bash -s -- --version=0.17.1
          echo "$HOME/.wasmedge/bin" >> $GITHUB_PATH

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            injamm-build/vcpkg_installed
          key: ${{ runner.os }}-wasip1-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-wasip1-vcpkg-

      - name: Install vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi

      - name: Install injamm (wasip1, -fno-rtti)
        run: |
          git clone $INJAMM_REPO injamm
          cd injamm
          git fetch --depth 1 origin $INJAMM_REF
          git checkout FETCH_HEAD
          cd ..
          cmake -B injamm-build -S injamm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-wasip1 \
            -DVCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/triplets \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=/opt/wasi-sdk/share/cmake/wasi-sdk-p1.cmake \
            -DCMAKE_INSTALL_PREFIX=$HOME/injamm-install \
            -DCMAKE_CXX_FLAGS="-fno-rtti" \
            -DBUILD_TEST=OFF -DBUILD_EXAMPLE=OFF
          cmake --build injamm-build
          cmake --install injamm-build

      - name: Configure (wasip1, sqlite amalgamation)
        run: |
          cmake -B build-wasi -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-wasip1 \
            -DVCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/triplets \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=/opt/wasi-sdk/share/cmake/wasi-sdk-p1.cmake \
            -DCMAKE_PREFIX_PATH=$HOME/injamm-install \
            -DINJAMM_SQLITE3_FETCH_AMALGAMATION=ON

      - name: Build
        run: cmake --build build-wasi

      - name: Test
        run: ctest --test-dir build-wasi -V

