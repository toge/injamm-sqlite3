            ~/vcpkg/bootstrap-vcpkg.sh
          fi

      - name: Install injamm
        run: |
          git clone $INJAMM_REPO injamm
          cd injamm
          git fetch --depth 1 origin $INJAMM_REF
          git checkout FETCH_HEAD
          cd ..
          cmake -B injamm-build -S injamm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_INSTALL_PREFIX=$HOME/injamm-install \
            -DBUILD_TEST=OFF -DBUILD_EXAMPLE=OFF
          cmake --build injamm-build
          cmake --install injamm-build

      - name: Configure with sanitizers
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_PREFIX_PATH=$HOME/injamm-install \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DENABLE_THREADED_DISPATCH=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build -V

  windows-msvc:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg
            build\vcpkg_installed
            injamm-build\vcpkg_installed
          key: ${{ runner.os }}-msvc-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-msvc-vcpkg-

      - name: Setup vcpkg
        run: |
          if not exist C:\vcpkg (
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            call C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          )
        shell: cmd

      - name: Install injamm
        run: |
          git clone $env:INJAMM_REPO injamm
          cd injamm
          git fetch --depth 1 origin $env:INJAMM_REF
          git checkout FETCH_HEAD
          cd ..
          cmake -B injamm-build -S injamm -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake -DCMAKE_INSTALL_PREFIX=C:\injamm-install -DBUILD_TEST=OFF -DBUILD_EXAMPLE=OFF
          cmake --build injamm-build --config Release
          cmake --install injamm-build --config Release

      - name: Configure
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake -DCMAKE_PREFIX_PATH=C:\injamm-install

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -V -C Release

